# =============================================================================
# Upstream Next.js Store
# =============================================================================
upstream nextjs_store {
    server store:3001;
    keepalive 32;
}

# =============================================================================
# HTTPS - Store (sneakersflash.com & www)
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sneakersflash.com www.sneakersflash.com;

    # SSL Certificates (sama dengan api, karena wildcard/SAN)
    ssl_certificate /etc/letsencrypt/live/sneakersflash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sneakersflash.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # WAF
    if ($blocked_agent) { return 403; }
    if ($blocked_query) { return 400; }

    # Static files Next.js (_next/static) — cache agresif
    location /_next/static/ {
        proxy_pass http://nextjs_store;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host $host;
        access_log off;
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://nextjs_store;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Public static files
    location /favicon.ico {
        proxy_pass http://nextjs_store;
        access_log off;
        expires 30d;
    }

    # Health check store
    location = /health-check {
        return 200 "OK";
        add_header Content-Type text/plain;
        access_log off;
    }

    # Semua request → Next.js
    location / {
        limit_req zone=global burst=50 nodelay;
        proxy_pass http://nextjs_store;
        include /etc/nginx/snippets/proxy-params.conf;

        # Untuk Next.js SSR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
